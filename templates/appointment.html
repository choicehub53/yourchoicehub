<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book an Appointment | Your Choice Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff8ed, #ffe6c7);
            color: #333;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .logo {
            height: 65px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
        }

        nav a:hover {
            color: #d49a28;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .appointment-card {
            background: white;
            padding: 45px 40px;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #8b5e18;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            font-size: 20px;
            color: #555;
            margin-bottom: 15px;
        }

        .notice {
            display: block;
            width: fit-content;
            margin: 20px auto 30px;
            background: #fff1d6;
            color: #8b5e18;
            padding: 12px 22px;
            border-radius: 25px;
            font-weight: bold;
        }

        .intro {
            text-align: center;
            font-size: 17px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #d49a28;
            box-shadow: 0 0 5px rgba(212,154,40,0.2);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .row {
            display: flex;
            gap: 18px;
        }

        .row .form-group {
            flex: 1;
        }

        .whatsapp {
            width: 100%;
            border: none;
            margin-top: 10px;
            padding: 17px 25px;
            background: #25D366;
            color: white;
            border-radius: 35px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(37,211,102,0.3);
            transition: 0.2s ease;
        }

        .whatsapp:hover {
            transform: translateY(-2px);
        }

        .phone {
            text-align: center;
            margin-top: 22px;
            font-size: 20px;
            font-weight: bold;
            color: #8b5e18;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .appointment-card {
                padding: 35px 22px;
            }

            h1 {
                font-size: 32px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<header>

    <img src="{{ url_for('static', filename='images/logo.png') }}"
         alt="Your Choice Hub"
         class="logo">

    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>

</header>


<div class="container">

    <div class="appointment-card">

        <h1>Book an Appointment</h1>

        <div class="subtitle">
            Your Choice Hub
        </div>

        <div class="notice">
            ✨ Visits by Appointment Only ✨
        </div>

        <p class="intro">
            Please provide your details below. We will receive your
            appointment request directly on WhatsApp.
        </p>


        <form id="appointmentForm">

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text"
                       id="name"
                       placeholder="Enter your full name"
                       required>
            </div>


            <div class="form-group">
                <label for="mobile">Mobile Number *</label>
                <input type="tel"
                       id="mobile"
                       placeholder="Enter your mobile number"
                       required>
            </div>


            <div class="row">

                <div class="form-group">
                    <label for="date">Preferred Date *</label>
                    <input type="date"
                           id="date"
                           required>
                </div>

                <div class="form-group">
                    <label for="time">Preferred Time *</label>
                    <input type="time"
                           id="time"
                           required>
                </div>

            </div>


            <div class="form-group">
                <label for="service">Purpose of Visit *</label>

                <select id="service" required>

                    <option value="">
                        Select an option
                    </option>

                    <option value="Jewellery">
                        Jewellery
                    </option>

                    <option value="Fashion Accessories">
                        Fashion Accessories
                    </option>

                    <option value="Premium Bags">
                        Premium Bags
                    </option>

                    <option value="Jewellery Valuation">
                        Jewellery Valuation
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="message">
                    Additional Message
                </label>

                <textarea id="message"
                          placeholder="Any additional information you would like to share..."></textarea>

            </div>


            <button type="submit" class="whatsapp">
                💬 Send Appointment Request on WhatsApp
            </button>

        </form>


        <p class="phone">
            📱 7977292916
        </p>

    </div>

</div>


<footer>
    © Your Choice Hub. All Rights Reserved.
</footer>


<script>

    document.getElementById("appointmentForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value;
        const mobile = document.getElementById("mobile").value;
        const date = document.getElementById("date").value;
        const time = document.getElementById("time").value;
        const service = document.getElementById("service").value;
        const message = document.getElementById("message").value;

        const whatsappMessage =
`Hello Your Choice Hub,

I would like to book an appointment.

Name: ${name}
Mobile: ${mobile}
Preferred Date: ${date}
Preferred Time: ${time}
Purpose of Visit: ${service}
Additional Message: ${message || "None"}

Thank you.`;

        const whatsappURL =
            "https://wa.me/917977292916?text=" +
            encodeURIComponent(whatsappMessage);

        window.open(whatsappURL, "_blank");

    });

</script>

</body>
</html>
```
