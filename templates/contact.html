<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Your Choice Hub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

<header>

    <img src="{{ url_for('static', filename='images/logo.png') }}"
         alt="Your Choice Hub Logo"
         class="logo">

    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>

</header>

<main>

    <h1>Contact Us</h1>

    <form method="POST" action="{{ url_for('contact') }}">

        <label for="name">Name:</label><br>

        <input type="text"
               id="name"
               name="name"
               required>

        <br><br>


        <label for="email">Email:</label><br>

        <input type="email"
               id="email"
               name="email"
               required>

        <br><br>


        <label for="message">Message:</label><br>

        <textarea id="message"
                  name="message"
                  rows="5"
                  required></textarea>

        <br><br>


        <button type="submit">
            Send Enquiry
        </button>

    </form>

</main>

<footer>

    <p>
        📍 203, Rustom Bldg, Veer Nariman Road, Fort, Mumbai 400001
        <br>
        📞 7977292916 |
        ✉️ choicehub53@gmail.com
    </p>

</footer>

</body>
</html>
